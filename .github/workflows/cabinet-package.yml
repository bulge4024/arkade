name: Cabinet test package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cabinet-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Test update feed, verification and schedule
        run: dotnet run --project tests/UpdaterChecks/UpdaterChecks.csproj -c Release
      - name: Test controller navigation and mappings
        run: dotnet run --project tests/ControllerChecks/ControllerChecks.csproj -c Release
      - name: Test metadata queue, retries and progress
        run: dotnet run --project tests/MetadataChecks/MetadataChecks.csproj -c Release
      - name: Test broad console metadata and corrupt data recovery
        run: dotnet run --project tests/BroadMetadataChecks/BroadMetadataChecks.csproj -c Release
      - name: Test metadata refresh UI and artwork crash recovery
        run: dotnet run --project tests/MetadataUiChecks/MetadataUiChecks.csproj -c Release
      - name: Test background download queue and deferred installation
        run: dotnet run --project tests/DownloadQueueChecks/DownloadQueueChecks.csproj -c Release
      - name: Test remote ROM downloads, replacements and schedule
        run: dotnet run --project tests/RomChecks/RomChecks.csproj -c Release
      - name: Test isolated installer with Windows PowerShell
        shell: powershell
        run: ./tests/UpdaterChecks/InstallChecks.ps1
      - name: Publish cabinet test ZIP
        shell: pwsh
        run: |
          $version = "0.2.$env:GITHUB_RUN_NUMBER"
          ./scripts/Publish-TestBuild.ps1 -Version $version
          "ARKADE_VERSION=$version" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Arkade-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:ARKADE_VERSION"
          $notes = "Arkade cabinet test build $env:ARKADE_VERSION. Download the ZIP and run Setup.cmd for a first installation. Existing installations with the updater can install this release from Settings or the automatic two-day check. Includes the .NET runtime; games and emulators are not included."
          $notes | Set-Content release-notes.txt -Encoding utf8
          gh release create $tag --target $env:GITHUB_SHA --title "Arkade Cabinet Test $env:ARKADE_VERSION" --draft --prerelease --notes-file release-notes.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          gh release upload $tag (Get-ChildItem artifacts/*.zip, artifacts/*.sha256 | ForEach-Object FullName)
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed. The draft has not been published.' }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
